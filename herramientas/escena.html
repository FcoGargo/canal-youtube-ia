<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Caveat;src:url(fonts/Caveat.ttf);font-weight:400 700}
@font-face{font-family:Patrick;src:url(fonts/PatrickHand.ttf)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Estilo propio "Ink Notebook": papel cuadriculado, tinta, marcadores, personajes de papel con cara.
const W=1920,H=1080,cv=document.getElementById('c'),g=cv.getContext('2d');
const INK='#1d2433',RED='#e0362c',GRN='#22a35a',BLU='#2b5fd9',GRY='#8a8f99',YEL='rgba(255,214,0,0.6)',SKIN='#f3d2b4',PAPER='#f6f1e4';
let TL=null,BOIL=0,T=0,SHAKE=0;
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3), cl=x=>x<0?0:x>1?1:x;
const back=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const smooth=x=>{x=cl(x);return x*x*(3-2*x);};
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function jit(x,y,k){return [x+(rnd(k*3.1+BOIL*17.3)-.5)*2.4,y+(rnd(k*7.7+BOIL*5.9)-.5)*2.4];}
// ---------- primitivas ----------
function path(pts,p,col=INK,w=5){ if(p<=0)return; let L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const tot=L[L.length-1]*cl(p);g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.beginPath();let q=jit(pts[0][0],pts[0][1],0);g.moveTo(q[0],q[1]);
  for(let i=1;i<pts.length;i++){if(L[i]<=tot){q=jit(pts[i][0],pts[i][1],i);g.lineTo(q[0],q[1]);}else{const f=(tot-L[i-1])/(L[i]-L[i-1]);g.lineTo(pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f);break;}} g.stroke();}
function ell(cx,cy,rx,ry,n=40){const a=[];for(let i=0;i<=n;i++){const t=-Math.PI/2+i/n*Math.PI*2.04;a.push([cx+Math.cos(t)*rx,cy+Math.sin(t)*ry]);}return a;}
function rect(x,y,w,h){return [[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y-3]];}
function multi(list,p,col,w){const n=list.length;for(let i=0;i<n;i++)path(list[i],cl(p*n-i),col,w);}
function fillPoly(pts,col,a=1){g.save();g.globalAlpha*=a;g.fillStyle=col;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(const q of pts)g.lineTo(q[0],q[1]);g.closePath();g.fill();g.restore();}
function txt(s,x,y,size,p,{col=INK,font='Caveat',bold=700,align='left',hl=false,rot=0,pop=false}={}){
  if(p<=0)return; g.save();g.translate(x,y);g.rotate(rot);if(pop){const k=back(p*1.6);g.scale(k,k);} g.font=`${bold} ${size}px ${font}`;g.textBaseline='middle';
  const w=g.measureText(s).width;let x0=align==='center'?-w/2:align==='right'?-w:0;
  if(hl){g.fillStyle=YEL;const hp=cl(p*1.4-.2);g.beginPath();g.moveTo(x0-12,-size*.32);g.lineTo(x0-12+(w+24)*hp,-size*.36);g.lineTo(x0-12+(w+24)*hp,size*.38);g.lineTo(x0-12,size*.34);g.fill();}
  if(!pop){g.beginPath();g.rect(x0-20,-size,(w+40)*ease(p),size*2);g.clip();}
  g.fillStyle=col;g.fillText(s,x0,0);g.restore();}
function arrow(x1,y1,x2,y2,p,col=INK,w=6,dash=false){ if(dash)g.setLineDash([16,14]);path([[x1,y1],[(x1+x2)/2,(y1+y2)/2-30],[x2,y2]],cl(p*1.25),col,w);g.setLineDash([]);
  if(p>.8){const a=Math.atan2(y2-((y1+y2)/2-30),x2-(x1+x2)/2),L=28;path([[x2-L*Math.cos(a-.45),y2-L*Math.sin(a-.45)],[x2,y2],[x2-L*Math.cos(a+.45),y2-L*Math.sin(a+.45)]],cl((p-.8)*5),col,w);}}
function popIn(x,y,p,fn){ if(p<=0)return; const k=back(p); g.save();g.translate(x,y);g.scale(k,k);g.globalAlpha*=cl(p*4);fn();g.restore(); }
// ---------- personajes de papel ----------
// kind: 'alice' | 'jensen' | 'guy'; look: -1..1 mirada; mood: 'n','sus','shock','smile'
function puppet(x,y,s,p,kind,{look=0,mood='n',seed=0}={}){
  popIn(x,y,p,()=>{ g.scale(s,s);
    const bob=Math.sin(T*2.1+seed)*3; g.translate(0,bob);
    const body=kind==='alice'?'#c8323b':kind==='jensen'?'#23262d':'#4a6fa5';
    // torso
    g.fillStyle=body;g.beginPath();g.moveTo(-95,40);g.quadraticCurveTo(-100,-30,-40,-45);g.lineTo(40,-45);g.quadraticCurveTo(100,-30,95,40);g.lineTo(95,160);g.lineTo(-95,160);g.closePath();g.fill();
    g.strokeStyle=INK;g.lineWidth=6;g.stroke();
    if(kind==='jensen'){g.fillStyle='#9aa0a8';g.beginPath();g.moveTo(-25,-45);g.lineTo(0,40);g.lineTo(25,-45);g.fill();path([[-28,-44],[-8,60]],1,'#55595f',4);path([[28,-44],[8,60]],1,'#55595f',4);}
    if(kind==='alice'){g.fillStyle='#f6f1e4';g.beginPath();g.moveTo(-22,-45);g.lineTo(0,-5);g.lineTo(22,-45);g.fill();}
    // cabeza
    g.fillStyle=SKIN;g.beginPath();g.ellipse(0,-120,72,80,0,0,7);g.fill();g.stroke();
    // pelo
    g.fillStyle=kind==='alice'?'#1e1b1b':kind==='jensen'?'#c9ccd1':'#5b3a24';
    if(kind==='alice'){g.beginPath();g.ellipse(0,-150,78,58,0,Math.PI,0);g.lineTo(78,-90);g.quadraticCurveTo(70,-150,0,-160);g.quadraticCurveTo(-70,-150,-78,-90);g.fill();g.beginPath();g.ellipse(0,-205,30,24,0,0,7);g.fill();}
    else if(kind==='jensen'){g.beginPath();g.moveTo(-72,-130);g.quadraticCurveTo(-70,-210,10,-205);g.quadraticCurveTo(80,-200,72,-125);g.quadraticCurveTo(40,-175,-10,-160);g.quadraticCurveTo(-50,-155,-72,-130);g.fill();
      g.strokeStyle=INK;g.lineWidth=4;g.beginPath();g.ellipse(-26,-118,20,16,0,0,7);g.stroke();g.beginPath();g.ellipse(26,-118,20,16,0,0,7);g.stroke();path([[-6,-118],[6,-118]],1,INK,4);}
    else {g.beginPath();g.ellipse(0,-170,70,40,0,Math.PI,0);g.fill();}
    // ojos con parpadeo
    const blink=((T+seed*1.3)%3.7)<.12; const lx=look*8;
    g.fillStyle=INK;
    if(blink){path([[-34,-118],[-18,-118]],1,INK,4);path([[18,-118],[34,-118]],1,INK,4);}
    else{ const ry=mood==='shock'?11:8; g.beginPath();g.ellipse(-26+lx,-118,6,ry,0,0,7);g.ellipse(26+lx,-118,6,ry,0,0,7);g.fill(); }
    if(mood==='sus'){path([[-40,-140],[-14,-134]],1,INK,5);path([[14,-134],[40,-140]],1,INK,5);}
    if(mood==='shock'){path([[-40,-146],[-14,-142]],1,INK,4);path([[14,-142],[40,-146]],1,INK,4);}
    // boca
    if(mood==='shock'){g.fillStyle=INK;g.beginPath();g.ellipse(0,-78,10,14,0,0,7);g.fill();}
    else if(mood==='sus')path([[-14,-80],[14,-84]],1,INK,4);
    else path([[-18,-84],[0,-74],[18,-84]],1,INK,4);
    // mejillas
    g.fillStyle='rgba(224,54,44,.18)';g.beginPath();g.ellipse(-46,-96,12,8,0,0,7);g.ellipse(46,-96,12,8,0,0,7);g.fill();
  });
}
function table(cx,cy,rx,ry,p){ if(p<=0)return; g.save();g.globalAlpha*=cl(p*2);fillPoly(ell(cx,cy,rx,ry,50),'#b98a5a');g.restore();path(ell(cx,cy,rx,ry,50),p,INK,6);
  if(p>.6){g.fillStyle='#e9dcc4';g.globalAlpha=cl((p-.6)*3);g.beginPath();g.ellipse(cx-130,cy-10,40,14,0,0,7);g.ellipse(cx+130,cy-10,40,14,0,0,7);g.fill();g.globalAlpha=1;}}
function chip(cx,cy,s,p,glow=0){ if(p<=0)return; const r=110*s;
  if(glow>0){const gr=g.createRadialGradient(cx,cy,r*.5,cx,cy,r*2.2);gr.addColorStop(0,`rgba(34,163,90,${.35*glow})`);gr.addColorStop(1,'rgba(34,163,90,0)');g.fillStyle=gr;g.fillRect(cx-r*2.5,cy-r*2.5,r*5,r*5);}
  g.save();g.globalAlpha*=cl(p*2);g.fillStyle='#1f5e3b';g.fillRect(cx-r,cy-r,2*r,2*r);g.fillStyle='#2b2f36';g.fillRect(cx-r*.55,cy-r*.55,r*1.1,r*1.1);g.restore();
  const parts=[rect(cx-r,cy-r,2*r,2*r),rect(cx-r*.55,cy-r*.55,r*1.1,r*1.1)];
  for(let i=-2;i<=2;i++){const o=i*r*.36;parts.push([[cx+o,cy-r],[cx+o,cy-r-28*s]],[[cx+o,cy+r],[cx+o,cy+r+28*s]],[[cx-r,cy+o],[cx-r-28*s,cy+o]],[[cx+r,cy+o],[cx+r+28*s,cy+o]]);}
  multi(parts,p,INK,6*s); txt('GPU',cx,cy+4*s,60*s,cl(p*2-1),{align:'center',col:'#7dffb0'});}
function blob(cx,cy,rx,ry,label,p,col=INK,fill='#ffffff'){ const pts=ell(cx,cy,rx,ry,48).map((q,i)=>[q[0]+Math.sin(i*1.7)*rx*.08,q[1]+Math.cos(i*2.3)*ry*.08]);
  if(p>0){g.save();g.globalAlpha*=cl(p*1.5)*.85;fillPoly(pts,fill);g.restore();} path(pts,cl(p*1.4),col,6); txt(label,cx,cy,60,cl(p*2-.8),{align:'center',col});}
function stamp(s,x,y,p,rot=-.1,col=RED,sc=1){ if(p<=0)return; const k=sc*(1+1.4*(1-ease(p)));g.save();g.globalAlpha=cl(p*3);g.translate(x,y);g.rotate(rot);g.scale(k,k);
  g.font='700 92px Patrick';const w=g.measureText(s).width;g.fillStyle='rgba(246,241,228,.75)';g.fillRect(-w/2-30,-70,w+60,140);g.strokeStyle=col;g.lineWidth=9;g.strokeRect(-w/2-30,-70,w+60,140);g.lineWidth=3;g.strokeRect(-w/2-18,-58,w+36,116);g.fillStyle=col;g.textAlign='center';g.textBaseline='middle';g.fillText(s,0,4);g.restore();}
function card(x,y,w,h,p,head,lines,{col=INK,rot=0,headCol=INK}={}){ if(p<=0)return; const e=back(p); g.save();g.translate(x+w/2,y+h/2);g.rotate(rot*(2-e));g.scale(.6+.4*e,.6+.4*e);g.globalAlpha=cl(p*3);
  g.fillStyle='#fffdf5';g.shadowColor='rgba(0,0,0,.22)';g.shadowBlur=28;g.shadowOffsetY=12;g.fillRect(-w/2,-h/2,w,h);g.shadowColor='transparent';g.translate(-w/2,-h/2);
  txt(head,30,52,56,cl(p*2-.3),{col:headCol});path([[24,92],[w-24,94]],cl(p*2-.5),headCol,4);
  lines.forEach((l,i)=>txt(l,30,148+i*62,48,cl(p*2-.7-i*.25),{font:'Patrick',bold:400,col}));g.restore();}
function bubble(x,y,w,h,p,who,said,col){ if(p<=0)return; popIn(x+w/2,y+h/2,p,()=>{ g.translate(-w/2,-h/2);
  g.fillStyle='#fffdf5';g.fillRect(0,0,w,h);path(rect(0,0,w,h),1,col,6);fillPoly([[50,h-3],[40,h+50],[110,h-3]],'#fffdf5');path([[50,h],[40,h+50],[110,h]],1,col,6);
  txt(who,28,50,62,1,{col});said.forEach((l,i)=>txt(l,28,122+i*54,46,cl(p*2-.5-i*.2),{font:'Patrick',bold:400}));});}
function house(x,y,s,p){ if(p>0){g.save();g.globalAlpha*=cl(p*2);fillPoly([[x-150*s,y],[x,y-100*s],[x+150*s,y]],'#ffffff');g.fillStyle='#ffffff';g.fillRect(x-130*s,y,260*s,170*s);g.restore();}
  multi([[[x-150*s,y],[x,y-100*s],[x+150*s,y]],rect(x-130*s,y,260*s,170*s),[[x-80*s,y+20*s],[x-80*s,y+170*s]],[[x-27*s,y+20*s],[x-27*s,y+170*s]],[[x+27*s,y+20*s],[x+27*s,y+170*s]],[[x+80*s,y+20*s],[x+80*s,y+170*s]]],p,INK,6);}
function building(x,y,s,p){ if(p>0){g.save();g.globalAlpha*=cl(p*2)*.9;g.fillStyle='#d9d4c7';g.fillRect(x-120*s,y-260*s,240*s,260*s);g.restore();}
  const parts=[rect(x-120*s,y-260*s,240*s,260*s)];for(let r=0;r<4;r++)for(let c=0;c<3;c++)parts.push(rect(x-90*s+c*65*s,y-230*s+r*58*s,36*s,32*s));multi(parts,p,INK,5);
  if(p>.9){g.fillStyle=RED;g.fillRect(x-4,y-330*s,8,70*s);fillPoly([[x+4,y-330*s],[x+70*s,y-312*s],[x+4,y-294*s]],RED);} }
function crate(x,y,s,p){ popIn(x,y,p,()=>{g.scale(s,s);g.fillStyle='#c79a63';g.fillRect(-70,-70,140,140);path(rect(-70,-70,140,140),1,INK,5);path([[-70,-70],[70,70]],1,INK,4);path([[70,-70],[-70,70]],1,INK,4);
  g.fillStyle='#1f5e3b';g.fillRect(-26,-26,52,52);});}
function eye(x,y,s,p){ if(p<=0)return; popIn(x,y,p,()=>{g.scale(s,s);g.fillStyle='#fff';g.beginPath();g.moveTo(-90,0);g.quadraticCurveTo(0,-70,90,0);g.quadraticCurveTo(0,70,-90,0);g.fill();
  path([[-90,0],[0,-50],[90,0],[0,50],[-90,0]],1,INK,6);const lx=Math.sin(T*1.3)*20;g.fillStyle=INK;g.beginPath();g.ellipse(lx,0,26,26,0,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.ellipse(lx+8,-8,7,7,0,0,7);g.fill();});}
function cross(x,y,s,p,col=RED){multi([[[x-30*s,y-30*s],[x+30*s,y+30*s]],[[x+30*s,y-30*s],[x-30*s,y+30*s]]],p,col,9*s);}
function money(v){return '$'+(v/1e9).toFixed(1)+' BILLION';}
function flash(p){ if(p>0&&p<1){g.save();g.setTransform(1,0,0,1,0,0);g.fillStyle=`rgba(255,255,255,${(1-p)*.9})`;g.fillRect(0,0,W,H);g.restore();}}
// ---------- papel ----------
function paper(){ g.fillStyle=PAPER;g.fillRect(-W,-H,3*W,3*H);g.strokeStyle='rgba(80,120,190,.14)';g.lineWidth=2;
  for(let x=-W;x<2*W;x+=48){g.beginPath();g.moveTo(x,-H);g.lineTo(x,2*H);g.stroke();} for(let y=-H+24;y<2*H;y+=48){g.beginPath();g.moveTo(-W,y);g.lineTo(2*W,y);g.stroke();}
  g.strokeStyle='rgba(216,52,44,.35)';g.lineWidth=3;g.beginPath();g.moveTo(130,-H);g.lineTo(130,2*H);g.stroke();}
function wipe(a){ if(a<=0)return; g.save();g.globalAlpha=Math.min(1,a);paper();g.restore();}
// ---------- escenas ----------
// CAM[s] = [[linea,retraso,cx,cy,zoom],...]  SFX = [[linea,retraso,tipo],...]
const S=[],CAM=[],SFX=[];
CAM[1]=[[0,0,960,540,1.15],[0,1.2,980,560,1],[1,2.4,1250,430,1.25],[1,4.2,980,560,1],[2,0,640,620,1.15],[2,2.6,820,500,1.35],[3,0,960,540,1]];
SFX.push([0,.05,'boom'],[0,1,'pop'],[0,1.6,'pop'],[1,2.4,'whoosh'],[1,4.2,'shutter'],[2,0,'whoosh'],[2,2.8,'sting'],[3,0,'boom']);
S[1]=(t,e)=>{
  txt('June 2024 · Taipei',190,110,96,(t-e(0,.1))/1.1,{hl:true});
  puppet(820,600,1.1,(t-e(0,1))/.6,'alice',{look:.6,seed:1}); puppet(1140,600,1.1,(t-e(0,1.6))/.6,'jensen',{look:-.4,mood:'smile',seed:2});
  table(980,740,420,95,(t-e(0,.5))/1);
  txt('Jensen Huang',1430,330,70,(t-e(1,2.6))/.8,{col:GRN}); txt('CEO of Nvidia',1430,395,48,(t-e(1,3))/.8,{font:'Patrick',bold:400});
  arrow(1420,360,1230,420,(t-e(1,2.8))/.6,GRN);
  path(rect(590,300,780,560),(t-e(1,4.2))/.5,INK,5); flash((t-e(1,4.2))/.5);
  card(110,560,560,330,(t-e(2,0))/.7,'NYT · Oct 29, 2026',['US intelligence believed','she was gathering info','for China'],{rot:-.05,headCol:RED});
  if(t>e(2,2.8)) puppet(820,600,1.1,1,'alice',{look:.6,mood:'sus',seed:1});
  txt('?',820,300,170,(t-e(2,2.6))/.4,{col:RED,align:'center',pop:true});
  path(ell(820,560,150,230,40),(t-e(2,2.8))/.7,RED,8);
  const tp=t-e(3,0); if(tp>0){wipe(tp/.35);
    txt('THE WOMAN',W/2,330,170,tp/.6,{align:'center',pop:true}); txt('next to Nvidia\'s CEO',W/2,520,140,(tp-.6)/1,{align:'center',hl:true});
    chip(W/2,800,.7,(tp-2)/1,1); }
};
CAM[2]=[[4,0,700,500,1.2],[5,0,1300,700,1.25],[6,0,960,540,1],[6,3.2,960,560,1.15],[7,0,960,560,1]];
SFX.push([4,0,'whoosh'],[4,2.2,'pop'],[5,0,'whoosh'],[5,.6,'rise'],[6,0,'whoosh'],[6,3.2,'lock'],[7,0,'whoosh'],[7,.5,'run']);
S[2]=(t,e)=>{
  chip(560,460,1.5,(t-e(4,0))/1.2,cl((t-e(4,1))/1));
  multi([[[780,330],[840,290]],[[800,460],[880,460]],[[780,590],[840,630]]],(t-e(4,1.6))/.6,GRN,6);
  txt('= the engine of AI',900,460,84,(t-e(4,2.2))/1,{pop:false});
  const gp=t-e(5,0); path([[1060,900],[1060,560]],gp/.4,INK,5);path([[1060,900],[1700,900]],gp/.4,INK,5);
  [[1120,830],[1250,770],[1380,700],[1510,610],[1640,470]].forEach((b,i)=>{const h=back(cl((gp-.3-i*.15)/.5))*(900-b[1]);if(gp-.3-i*.15>0){g.fillStyle=GRN;g.fillRect(b[0]-40,900-h,80,h);path(rect(b[0]-40,900-h,80,h),1,INK,4);}});
  txt('one of the most valuable',1380,970,54,(gp-1)/1,{align:'center',font:'Patrick',bold:400});
  const mp=t-e(6,0); if(mp>0){wipe(mp/.35);
    blob(420,520,240,175,'USA',mp/.8,BLU,'#dbe6ff'); blob(1500,520,240,175,'CHINA',(mp-.3)/.8,RED,'#ffdcd8');
    const k=smooth((mp-1)/1.8); chip(700+k*360,520,.5,(mp-.8)/.5);
    arrow(660,520,1250,520,(mp-.8)/1.6,INK,6,true);
    if(mp>3.2){popIn(1080,520,(mp-3.2)/.4,()=>{g.fillStyle='#e8b54a';g.fillRect(-60,-40,120,95);path(rect(-60,-40,120,95),1,INK,7);path([[-38,-40],[-38,-80],[0,-104],[38,-80],[38,-40]],1,INK,8);});}
    txt('Since 2022: export limits',W/2,790,84,(mp-3.6)/1,{align:'center',hl:true});}
  const rp=t-e(7,0); if(rp>0){wipe(rp/.35);
    txt('THE AI RACE',W/2,170,130,rp/.6,{align:'center',pop:true});
    path([[200,860],[1720,860]],rp/.5,INK,5); path([[1720,860],[1720,500]],(rp-.3)/.3,INK,5);
    if(rp>.5)fillPoly([[1720,500],[1850,540],[1720,580]],RED);
    const k1=smooth((rp-.4)/2.6),k2=smooth((rp-.4)/3.6)*.75;
    chip(330+k1*1270,720,.55,cl((rp-.3)*3),.8); txt('has the chips',330+k1*1270,560,50,cl((rp-.6)*2),{align:'center',font:'Patrick',bold:400,col:GRN});
    g.save();g.globalAlpha=.5;chip(330+k2*1270,800,.4,cl((rp-.3)*3));g.restore(); txt('doesn\'t',330+k2*1270,925,46,cl((rp-.6)*2),{align:'center',font:'Patrick',bold:400,col:GRY});}
};
CAM[3]=[[8,0,960,540,1],[8,.6,780,520,1.2],[9,0,1080,580,1.2],[10,0,960,700,1.1]];
SFX.push([8,0,'whoosh'],[8,.4,'type'],[9,0,'type'],[10,.3,'boing']);
S[3]=(t,e)=>{
  const p=t-e(8,0);
